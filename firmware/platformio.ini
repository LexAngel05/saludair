; SaludAIR firmware — ESP32 DevKit V1
; See ../docs/firmware-contract.md for the exact packet format and BLE layout.
;
; Hardware detected on this machine: CH340 USB-serial bridge on COM4
; (typical of ESP32 DevKit V1 / DevKitC clones).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
monitor_filters = esp32_exception_decoder

; NimBLE: smaller flash/RAM footprint than the stock ESP32 BLE stack,
; same NUS (Nordic UART Service) layout the dashboard expects.
; 2.x is required for the NimBLEConnInfo-based callback API used in main.cpp.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.2

build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
